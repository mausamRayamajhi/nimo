name: crypto_app
description: "Nimo Test Exercise"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ^3.35.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  json_annotation: ^4.9.0
  auto_route: ^10.1.2
  flutter_gen_runner: ^5.11.0
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  equatable: ^2.0.7
  intl: ^0.20.2
#  dio: ^5.9.0
  ft_foundation:
    path: packages/ft_foundation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  auto_route_generator: ^10.2.4
  json_serializable: ^6.10.0
  bloc_test: ^10.0.0


flutter_gen:
  output: lib/generated/flutter_gen
  integrations:
    flutter_svg: true

flutter:
  # [generate] is set to true to automatically generate the strings and other resources
  generate: true
  uses-material-design: true

  assets:
    - assets/json/
    - assets/image/


